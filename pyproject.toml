[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dramapack"
version = "0.1.0"
description = "Delivery packages, -14 LUFS mastering, subtitle safe areas, clean masters, acceptance audits and rights checks for short dramas (vertical / micro / AI dramas). CLI + MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dawnwood" }]
keywords = [
    "short drama", "vertical drama", "micro drama", "AI drama", "short-form video",
    "delivery package", "TikTok Drama Center", "DramaWave", "ReelShort",
    "loudness", "LUFS", "mastering", "subtitles", "burned subtitles", "safe area",
    "clean master", "ffmpeg", "MCP", "model context protocol", "AI agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["Pillow>=9.5", "mcp>=1.10"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://dawnwood.ai/open-source/"
Repository = "https://github.com/dawnwood-ai/dramapack"
Documentation = "https://github.com/dawnwood-ai/dramapack/tree/main/docs"
Issues = "https://github.com/dawnwood-ai/dramapack/issues"

[project.scripts]
dramapack = "dramapack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dramapack"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", ".pytest_cache", "/out", "/smoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
